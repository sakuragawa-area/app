<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>桜川奉仕区域</title>

  <!-- アイコン関連 -->
  <link rel="icon" href="https://raw.githubusercontent.com/sakuragawa-area/sakuragawa-favicon/main/favicon.ico">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/sakuragawa-area/sakuragawa-favicon/main/apple-touch-icon.png">
  
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #333333;
    }

    /* 全体を画面中央（上下左右）に寄せるコンテナ */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      /* 現在の中央位置から、上方向に少しずらす（例: 50px分上に移動） */
      transform: translateY(-80px); 
    }

    /* ロゴ画像の設定 */
    .logo-img {
      max-width: 360px;
      width: 95%;
      height: auto;
      margin-bottom: 24px;
      object-fit: contain;
    }

    /* 入力フォームカード */
    .form-card {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-label {
      font-size: 15px;
      font-weight: 600;
      color: #555555;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* 大きめの入力ボックス */
    .input-box {
      width: 70%;
      height: 52px;
      font-size: 18px;
      padding: 0 16px;
      border: 2px solid #cccccc;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background-color: #ffffff;
      -webkit-appearance: none;
    }

    .input-box:focus {
      border-color: #b3395b;
      box-shadow: 0 0 0 4px rgba(135, 18, 43, 0.15);
    }

    /* 大きめの開始ボタン */
    .btn-submit {
      width: 100%;
      height: 52px;
      margin-top: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background-color: #b3395b;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(135, 18, 43, 0.3);
      transition: background-color 0.2s ease, transform 0.1s ease;
      -webkit-appearance: none;
    }

    .btn-submit:active {
      background-color: #91193a;
      transform: scale(0.98);
    }

    /* エラーメッセージ */
    .error-msg {
      margin-top: 12px;
      font-size: 14px;
      color: #e53935;
      font-weight: bold;
      min-height: 20px;
    }

    .size_small {
      font-size: 13px;
    }

    /* 起動中（ローディング）用スタイリング */
    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- タイトルロゴ -->
    <img src="https://raw.githubusercontent.com/sakuragawa-area/sakuragawa-favicon/main/logo.png" alt="桜川奉仕区域 ロゴ" class="logo-img">

    <!-- 名前入力フォーム（常に表示） -->
    <div id="setup-form" class="form-card">
      <label class="form-label" for="username-input">
        アプリで使用する名前を入力<br>（フルネーム空白なし）
      </label>
      <input type="text" id="username-input" class="input-box" placeholder="例：山田太郎" autocomplete="off" oninput="updateButtonText()">
      <button id="submit-btn" onclick="saveAndStart()" class="btn-submit">アプリを開始</button>
      <div id="error-message" class="error-msg"></div>
      <div class="size_small"><br>
        ・ホーム画面追加やブックマークはこの画面で。<br>
        （毎回この画面から開始してください）<br><br>
        ・開始後のGoogle注意表示は右上のⅩで消去。
      </div>
    </div>

    <!-- ボタン押下後の起動中画面 -->
    <div id="loading-box" class="loading-box" style="display: none;">
      <div class="form-label" id="welcome-text">アプリを起動中...</div>
      <div class="spinner"></div>
    </div>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyZ-aT16KVxNBCUYjgcno3k-PASB_j0pY_8whziwxI5RKwgmZo8HABs6zVj6kTpK2C5sg/exec";
  const SECRET_KEY = "SakuragawaSecretKey_";

  // 暗号化関数
  function encodeToken(text) {
    const rawString = SECRET_KEY + text;
    const bytes = new TextEncoder().encode(rawString);
    const binString = String.fromCharCode(...bytes);
    return btoa(binString)
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');
  }

  // 入力文字またはローカルストレージの値に応じてボタン表示を変更
  function updateButtonText() {
    const inputVal = document.getElementById("username-input").value.trim();
    const savedName = localStorage.getItem("app_user_name") || "";
    
    // 入力欄に値があるか、もしくは保存された名前があれば有効化
    const effectiveName = inputVal || savedName;
    const btn = document.getElementById("submit-btn");

    if (effectiveName.length >= 3 && !/\s/.test(effectiveName)) {
      btn.textContent = `${effectiveName} として開始`;
    } else {
      btn.textContent = "アプリを開始";
    }
  }

  // 名前をローカルストレージから復元してセットする処理
  function restoreSavedName() {
    const savedName = localStorage.getItem("app_user_name");
    if (savedName) {
      const inputEl = document.getElementById("username-input");
      inputEl.value = savedName;
      updateButtonText();
    }
  }

  // ページ読み込み時
  window.onload = function() {
    restoreSavedName();
  };

  // 戻るボタンでページが復元された際の処理（iOS Safari対策強化）
  window.addEventListener("pageshow", function(event) {
    document.getElementById("setup-form").style.display = "flex";
    document.getElementById("loading-box").style.display = "none";
    
    // Safariの描画タイミングズレを防ぐため次フレームで実行
    requestAnimationFrame(function() {
      restoreSavedName();
    });
  });

  // 開始ボタン押下時の処理
  async function saveAndStart() {
    const inputEl = document.getElementById("username-input");
    const errorEl = document.getElementById("error-message");
    
    let rawInput = inputEl.value;
    const savedName = localStorage.getItem("app_user_name") || "";

    // 1. 入力欄が空だが、ローカルストレージに名前がある場合は保存済みの名前を採用
    if (!rawInput.trim() && savedName) {
      rawInput = savedName;
      inputEl.value = savedName; // 入力欄にも書き戻しを試みる
    }

    const inputVal = rawInput.trim();
    errorEl.textContent = "";

    // 2. 空白チェック
    if (/\s/.test(rawInput)) {
      errorEl.textContent = "空白は入れないでください";
      return;
    }

    // 3. 文字数チェック（3文字未満）
    if (inputVal.length < 3) {
      errorEl.textContent = "名前の文字数が足りません";
      return;
    }

    // 名前を保存・更新
    localStorage.setItem("app_user_name", inputVal);

    // 画面切り替え（ローディング状態表示）
    document.getElementById("setup-form").style.display = "none";
    document.getElementById("welcome-text").textContent = `${inputVal} さんとして起動中...`;
    document.getElementById("loading-box").style.display = "flex";

    // 4. 地域情報およびUser-Agentの取得
    let country = '';
    let region = '';
    const ua = encodeURIComponent(navigator.userAgent || '');

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1000); // 1秒でタイムアウト

      const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
      clearTimeout(timeoutId);

      if (res.ok) {
        const data = await res.json();
        country = data.country_code || data.country || '';
        region = data.region || data.city || '';
      }
    } catch (err) {
      console.warn('IP取得をスキップしました:', err);
    }

    // 5. トークン生成とパラメータ付与してGASへ遷移
    const token = encodeToken(inputVal);
    const targetUrl = `${GAS_URL}?token=${token}&country=${encodeURIComponent(country)}&region=${encodeURIComponent(region)}&ua=${ua}`;
    
    window.location.href = targetUrl;
  }
</script>
</body>
</html>
